[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cutsignal"
version = "0.1.0"
description = "Privacy-first, device-agnostic decision analytics for fat loss, strength retention, and diet optimization."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mingrui Li" }]
keywords = [
  "health-data",
  "fitness-analytics",
  "bayesian-state-space",
  "strength-training",
  "diet-optimization",
  "quantified-self",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "defusedxml>=0.7,<1",
  "highspy>=1.7,<2",
  "httpx>=0.27,<1",
  "numpy>=2,<2.4",
  "pandas>=2.2,<3",
  "platformdirs>=4,<5",
  "plotly>=5.24,<7",
  "pulp>=3,<4",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "scipy>=1.13,<2",
  "streamlit>=1.40,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6,<7",
  "mypy>=1.14,<2",
  "pandas-stubs>=2.2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "types-pyyaml>=6",
]

[project.scripts]
cutsignal = "cutsignal.cli:app"

[project.urls]
Homepage = "https://github.com/limingrui679-design/cutsignal"
Issues = "https://github.com/limingrui679-design/cutsignal/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cutsignal"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests that exercise multiple modules",
  "slow: computationally heavier statistical tests",
]

[tool.coverage.run]
branch = true
source = ["cutsignal"]
omit = [
  "src/cutsignal/app.py",
  "src/cutsignal/__main__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PTH"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"src/cutsignal/synthetic.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ["tests/", "src/cutsignal/app.py"]

[[tool.mypy.overrides]]
module = ["scipy.*", "plotly.*", "streamlit.*", "defusedxml.*", "pulp.*", "highspy.*"]
ignore_missing_imports = true
