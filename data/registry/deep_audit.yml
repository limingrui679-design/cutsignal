findings:
  - id: DA-P1-001
    priority: P1
    status: fixed_and_full_regression_verified
    summary: USDA normalization guessed the energy unit from magnitude and could misread explicit low-kJ values.
    resolution: Explicit nutrient IDs and units with kJ/kcal and mass conversion plus rejection tests.
    evidence: [src/cutsignal/importers/food.py, tests/test_food_and_cohort.py]
  - id: DA-P1-002
    priority: P1
    status: fixed_and_full_regression_verified
    summary: The nutrition stress scenario compounded 5 percent instead of adding the declared 5 percentage points.
    resolution: One additive uncertainty helper now drives macro and micronutrient stress coefficients.
    evidence: [src/cutsignal/optimization/diet.py, tests/test_diet_optimizer.py]
  - id: DA-P1-003
    priority: P1
    status: fixed_and_full_regression_verified
    summary: The core trend method had no executable alternative baseline on declared known truth.
    resolution: Fixed 12-run stress grid with a same-window OLS comparator and retained scenario failures.
    evidence: [src/cutsignal/evaluation.py, tests/test_evaluation.py, docs/VALIDATION.md]
  - id: DA-P1-004
    priority: P1
    status: fixed_and_full_regression_verified
    summary: Optional food endpoints accepted unsafe path identifiers and had no response-byte bound.
    resolution: Numeric identifier allowlists and streamed 5 MiB response cap with malformed/oversize tests.
    evidence: [src/cutsignal/importers/food.py, tests/test_food_and_cohort.py]
  - id: DA-P1-005
    priority: P1
    status: fixed_and_full_regression_verified
    summary: The prior strict audit was stale and could anchor this audit to an inherited provisional score.
    resolution: The prior review is preserved as historical and explicitly superseded by this independent rubric.
    evidence: [docs/STRICT_AUDIT.md, docs/DEEP_AUDIT_2026-08-24.md]
  - id: DA-P1-006
    priority: P1
    status: fixed_and_full_regression_verified
    summary: The Streamlit application test could fail during a valid cold start because its first-run bound was only 45 seconds.
    resolution: Every AppTest phase has an explicit 120-second bound inside the verifier's 300-second outer limit.
    evidence: [scripts/ui_smoke.py, scripts/verify_project.py]
  - id: DA-P1-007
    priority: P1
    status: fixed_and_full_regression_verified
    summary: The UI default gave optional trade-off solves too little time and exposed a solver exception when no incumbent was found.
    resolution: The default main solve is 8 seconds, trade-off profiles get at least 3 seconds, and expected domain failure becomes an actionable UI error.
    evidence: [src/cutsignal/app.py, scripts/ui_smoke.py]
  - id: DA-P1-008
    priority: P1
    status: fixed_and_full_regression_verified
    summary: A time-limited optional trade-off profile without an incumbent aborted an otherwise valid primary analysis.
    resolution: The primary balanced plan is reused, optional failures are skipped without being hidden, and labels/types/reasons are serialized and displayed.
    evidence: [src/cutsignal/optimization/diet.py, src/cutsignal/pipeline.py, tests/test_diet_optimizer.py, scripts/e2e_smoke.py]
  - id: DA-P1-009
    priority: P1
    status: fixed_and_full_regression_verified
    summary: Named method families had no authoritative provenance map or explicit transfer boundary.
    resolution: Ten primary or authoritative references now map each borrowed mechanism and what its citation cannot validate.
    evidence: [docs/REFERENCES.md, data/registry/method_references.yml, scripts/verify_method_references.py]
  - id: DA-P1-010
    priority: P1
    status: fixed_and_full_regression_verified
    summary: The publication scanner misclassified one DOI identifier and did not reject host-specific home paths.
    resolution: Phone matching excludes URL paths, local home paths are rejected, audit metadata is sanitized, and both paths have regression tests.
    evidence: [src/cutsignal/privacy.py, tests/test_pipeline_reporting_privacy.py, docs/DEEP_AUDIT_2026-08-24.md]
  - id: DA-P1-011
    priority: P1
    status: fixed_and_full_regression_verified
    summary: The publication privacy scan omitted workflows and some top-level files from the publishable checkout.
    resolution: Fingerprinting and privacy audit now share every tracked and non-ignored untracked checkout file.
    evidence: [scripts/verify_project.py, src/cutsignal/privacy.py]
  - id: DA-P1-012
    priority: P1
    status: fixed_and_full_regression_verified
    summary: Package, build metadata, citation metadata, and changelog versions could drift without a failing gate.
    resolution: A dedicated gate compares all version surfaces and the installed distribution; fresh-install smoke repeats the runtime check.
    evidence: [scripts/verify_versions.py, scripts/fresh_install_smoke.py, scripts/verify_project.py]
  - id: DA-P1-013
    priority: P1
    status: fixed_and_full_regression_verified
    summary: Source records lacked explicit version or snapshot boundaries and had no machine validator.
    resolution: Five sources declare access date, version/snapshot semantics, bundling, license/terms, caveats, and evidence paths under a failing gate.
    evidence: [data/registry/sources.yml, scripts/verify_sources.py, docs/DATA_SOURCES.md]
  - id: DA-P1-014
    priority: P1
    status: fixed_and_full_regression_verified
    summary: The engineering score consumed mutable generated files and a nonempty distribution directory could expose a stale wheel.
    resolution: Reset verifier-owned outputs, require one rebuilt wheel, record SHA-256 and byte size for seven critical artifacts, require a complete manifest and matching installed-wheel hash, bind every score dependency to those records, and treat pending P0/P1 regression as open.
    evidence: [scripts/verify_project.py, scripts/fresh_install_smoke.py, scripts/score_project.py, scripts/verify_deep_audit.py]
  - id: DA-P2-001
    priority: P2
    status: fixed_and_full_regression_verified
    summary: Synthetic evaluation console output omitted classification failures unless the JSON artifact was inspected.
    resolution: Console output includes accuracy, false positives, and false negatives; validation documentation retains observed failures.
    evidence: [scripts/evaluate_synthetic.py, docs/VALIDATION.md]
  - id: DA-P2-002
    priority: P2
    status: fixed_and_full_regression_verified
    summary: The documented root privacy command failed on ignored generated evidence after running verification.
    resolution: Broad directory walks skip declared generated/cache paths while exact checkout enumeration still scans every publishable file.
    evidence: [src/cutsignal/privacy.py, tests/test_pipeline_reporting_privacy.py, scripts/verify_project.py]

