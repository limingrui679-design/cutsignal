name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development environment
        run: python -m pip install --upgrade pip 'setuptools>=83,<85' && python -m pip install -e '.[dev]'
      - name: Verify exact checkout
        run: python scripts/verify_project.py
      - name: Require full engineering score
        run: python scripts/score_project.py
      - name: Upload machine evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cutsignal-verification-py${{ matrix.python-version }}
          if-no-files-found: error
          path: |
            artifacts/verification.json
            artifacts/dependency-audit.json
            artifacts/score.json
            artifacts/SCORECARD.md
            artifacts/coverage.json
            artifacts/cases.json
            artifacts/synthetic-evaluation.json
            artifacts/e2e/summary.json
            artifacts/fresh-install.json

  portability:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip 'setuptools>=83,<85' && python -m pip install -e '.[dev]'
      - name: Cross-platform core smoke
        run: python -m pytest -m "not slow" -q
      - name: Packaged-resource and adapter case
        run: python -m cutsignal cases run device-overlap-reconciliation
